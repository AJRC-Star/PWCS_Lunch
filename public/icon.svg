<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!--
    Colgan High School app icon — "CHS" on Colgan Blue.

    The letters are drawn as stroked vector paths rather than <text> on purpose:
    scripts/generate-icons.js rasterises this file to PNG during CI, where no
    particular font is guaranteed to be installed. A missing font would fail
    silently and ship a blank or mis-metricked icon.

    Colours are the school's own published palette — Colgan Blue #041E42 with a
    lighter Caribbean-leaning tint for the letterforms.

    Letterforms stay inside the maskable safe circle (radius ≈73 about the
    centre, stroke width included) so Android's circular mask cannot clip them.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4078" />
      <stop offset="100%" stop-color="#041E42" />
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="45" fill="url(#bgGrad)" />

  <g
    fill="none"
    stroke="#F4FAFE"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- C -->
    <path d="M68 84a20 20 0 1 0 0 24" />
    <!-- H -->
    <path d="M84 74v44M112 74v44M84 96h28" />
    <!-- S -->
    <path d="M156 82C156 73 130 72 130 84C130 93 156 99 156 108C156 119 130 119 130 110" />
  </g>
</svg>
